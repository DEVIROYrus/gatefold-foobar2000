# Gatefold 2.x releases. The files are built and checked on the maintainer's machine (foo_gatefold is not built
# here): they arrive on the branch `release-files` in a folder named after the tag (v2.0.1/: the installer, the
# component, the theme archive, SHA256SUMS.txt, release-notes.md). Pushing the tag publishes them as the
# repository's latest release (what the in-app update reads), then the branch's folder is no longer needed.
name: Release
on:
  push:
    tags: ['v2.*', 'v3.*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: release-files, path: files }
      - name: Check the files against SHA256SUMS.txt
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'; v="${tag#v}"
          cd "files/$tag"
          for f in "Gatefold-Setup-$v.exe" "foo_gatefold-$v.fb2k-component" "gatefold-theme-$v.zip" SHA256SUMS.txt release-notes.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          sha256sum -c SHA256SUMS.txt
          unzip -p "gatefold-theme-$v.zip" gatefold/js/version.js | grep -q "VERSION = '$v'"
          grep -q 'gatefold:end' release-notes.md
          echo "V=$v" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gatefold ${{ env.V }}
          body_path: files/${{ github.ref_name }}/release-notes.md
          prerelease: false
          make_latest: 'true'
          files: |
            files/${{ github.ref_name }}/Gatefold-Setup-*.exe
            files/${{ github.ref_name }}/foo_gatefold-*.fb2k-component
            files/${{ github.ref_name }}/gatefold-theme-*.zip
            files/${{ github.ref_name }}/SHA256SUMS.txt
