name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # a dry run: builds everything and keeps it as an artifact, publishes nothing
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Checks (the tag must match the theme version)
        run: node tools/check.mjs
      - name: Point the in-app updater at this repository
        shell: pwsh
        run: |
          $f = 'theme/js/version.js'
          (Get-Content $f -Raw) -replace "REPO = '[^']*'", "REPO = '${{ github.repository }}'" | Set-Content -NoNewline -Encoding UTF8 $f
          Select-String -Path $f -Pattern 'REPO'
      - name: Bundled software from the cache (fetched once per pinned version)
        uses: actions/cache@v4
        with:
          path: installer/.dl-cache
          key: deps-${{ hashFiles('installer/deps.lock.json') }}-v1
      - name: Fetch and verify bundled software
        id: deps
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $lock = Get-Content installer/deps.lock.json | ConvertFrom-Json
          ./installer/fetch-deps.ps1 -Fb2kVersion $lock.foobar2000 -ComponentTag $lock.foo_ui_webview2
      - name: Inno Setup 6.6
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress
      - name: Build installer and theme archive
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { (Get-Content package.json | ConvertFrom-Json).version }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$v" "/DRepoUrl=${{ github.server_url }}/${{ github.repository }}" installer/gatefold.iss
          New-Item -ItemType Directory -Force stage/gatefold | Out-Null
          Copy-Item -Recurse theme/* stage/gatefold/
          # one top folder (gatefold/…), forward slashes, deflate — what js/updater.js reads
          Compress-Archive -Path stage/gatefold -DestinationPath "dist/gatefold-theme-$v.zip"
      - name: Check the theme archive (what the in-app updater accepts)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Get-ChildItem dist/gatefold-theme-*.zip).FullName)
          $names = $z.Entries | ForEach-Object { $_.FullName }; $z.Dispose()
          if ($names | Where-Object { $_ -match '\\' }) { throw 'backslashes in the archive' }
          foreach ($n in 'gatefold/index.html', 'gatefold/js/version.js', 'gatefold/js/app.js') { if ($names -notcontains $n) { throw "missing $n" } }
          if ($names | Where-Object { $_ -notmatch '^gatefold/' }) { throw 'files outside gatefold/' }
          "ok: $($names.Count) entries"
      # Code signing: once the project is accepted by SignPath Foundation (free for open source),
      # upload dist/Gatefold-Setup-*.exe with actions/upload-artifact and submit it with
      # signpath/github-action-submit-signing-request — the exact steps are in docs/SIGNING.md.
      - name: Checksums and notes
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name } | Set-Content -Encoding ASCII dist/SHA256SUMS.txt
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { (Get-Content package.json | ConvertFrom-Json).version }
          if (-not ([regex]::IsMatch((Get-Content CHANGELOG.md -Raw), "(?m)^## \[?$([regex]::Escape($v))\]?"))) { throw "CHANGELOG.md has no section for $v" }
          $log = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?(?=^## |\z)").Value
          @"
          $section

          <!-- gatefold:end -->
          **Bundled:** foobar2000 ${{ steps.deps.outputs.fb2k }} (official unmodified installer) · foo_ui_webview2 ${{ steps.deps.outputs.fuw2 }} · WebView2 bootstrapper

          SHA-256 — see SHA256SUMS.txt. Bundled third-party checksums:
          ``````
          $(Get-Content installer/deps/SHA256SUMS.txt -Raw)
          ``````
          "@ | Set-Content -Encoding UTF8 notes.md
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with: { name: release-dry-run, path: "dist/*\nnotes.md", retention-days: 7 }
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: notes.md
          files: |
            dist/Gatefold-Setup-*.exe
            dist/gatefold-theme-*.zip
            dist/SHA256SUMS.txt
