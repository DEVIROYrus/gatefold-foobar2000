name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  theme:
    name: Theme — ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: write }   # the test output goes to a ci-log-<part> branch (below)
    # the end-to-end tests in parallel parts (one job took ~25 min); ONLY= picks tests by name
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: 'screens, settings, updates', id: screens, only: 'language,playlists,youtube,settings,updates,tooltips,canvas_volume,fb2k_prefs,welcome' }
          - { part: 'editing, windows, smart playlists, radio', id: editing, only: 'playlist_editing,windows,smart_color_radio' }
          - { part: 'sound analysis', id: sound, only: 'sound_ai' }
          - { part: 'layout', id: layout, only: 'layout' }
          - { part: 'stability', id: stability, only: 'stability' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Syntax, version, translations
        run: node tools/check.mjs
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Playwright
        run: |
          pip install playwright==1.56.0 onnx==1.17.0 numpy
          python -m playwright install --with-deps chromium
      - name: End-to-end (headless Chromium, mocked foobar2000 bridge)
        env: { ONLY: '${{ matrix.only }}', PYTHONUNBUFFERED: '1' }
        run: |
          set -o pipefail
          python tests/e2e.py 2>&1 | tee e2e.log
      - name: Remove an old failure log
        if: success() && github.event_name == 'push'
        run: git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete ci-log-${{ matrix.id }} 2>/dev/null || true
      # when a part fails, its output goes to the branch ci-log-<part> (readable with plain git)
      - name: Publish the output
        if: failure() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/log && cp e2e.log /tmp/log/ 2>/dev/null || echo "no output" > /tmp/log/e2e.log
          echo "${{ job.status }} ${GITHUB_SHA} $(date -u +%FT%TZ)" > /tmp/log/STATUS
          cd /tmp/log && git init -q -b ci-log-${{ matrix.id }}
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "e2e ${{ matrix.id }} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-${{ matrix.id }}

  installer:
    name: Installer — builds
    runs-on: windows-2022
    permissions: { contents: write }   # the first-start output goes to the ci-log-installer branch
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify bundled software
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $lock = Get-Content installer/deps.lock.json | ConvertFrom-Json
          ./installer/fetch-deps.ps1 -Fb2kVersion $lock.foobar2000 -ComponentTag $lock.foo_ui_webview2 *>&1 | Tee-Object -FilePath fetch.log
          if (-not (Test-Path installer/deps/versions.iss)) { throw 'fetch-deps did not finish' }
      - name: Inno Setup 6.6
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress
      - name: Compile
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$v" "/DRepoUrl=${{ github.server_url }}/${{ github.repository }}" installer/gatefold.iss
      # uploaded before the smoke test, so the installer can be tried by hand even when the test fails
      - uses: actions/upload-artifact@v4
        with:
          name: installer-preview
          path: dist/Gatefold-Setup-*.exe
          retention-days: 14
      - name: Silent install smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Gatefold-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log' -Wait -PassThru
          Get-Content setup.log -Tail 40
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          $prof = Join-Path $env:APPDATA 'foobar2000-v2'
          foreach ($f in 'webview-ui\default\index.html', 'webview-ui\default\js\i18n.js', 'user-components-x64\foo_ui_webview2\foo_ui_webview2.dll') {
            if (-not (Test-Path (Join-Path $prof $f))) { throw "missing $f" } else { "ok  $f" }
          }
          if (-not (Test-Path "$env:ProgramFiles\foobar2000\foobar2000.exe")) { throw 'foobar2000 was not installed' }
          (Get-Item "$env:ProgramFiles\foobar2000\foobar2000.exe").VersionInfo.FileVersion
      - name: First start opens in Gatefold
        shell: powershell
        run: |
          .\tools\first-start-check.ps1 *>&1 | Tee-Object -FilePath first-start.log
          if (Select-String -Path first-start.log -Pattern '^ok: ' -Quiet) { exit 0 } else { exit 1 }
      - name: Remove old logs
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          for b in ci-log-installer probe-log; do git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete $b 2>/dev/null || true; done
      - name: Publish the output
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/log && cp fetch.log first-start.log first-start.png setup.log /tmp/log/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA} $(date -u +%FT%TZ)" > /tmp/log/STATUS
          cd /tmp/log && git init -q -b ci-log-installer
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "installer ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-installer
      - name: Setup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log
          path: setup.log
          if-no-files-found: ignore
          retention-days: 14
