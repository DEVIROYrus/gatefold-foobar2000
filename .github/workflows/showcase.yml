# Real Creative-Commons music for the README screenshots, the social preview and the demo
# (tools/showcase/). The Internet Archive is reachable from here; the results go to the showcase-data branch.
name: showcase
on:
  workflow_dispatch:
    inputs:
      step: { description: 'scout | build', required: true, default: 'scout' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Downloaded albums, kept between runs (the Archive is sometimes slow or down)
        if: inputs.step == 'build'
        uses: actions/cache@v4
        with:
          path: .showcase-dl
          key: showcase-dl-${{ hashFiles('tools/showcase/albums.json') }}
          restore-keys: showcase-dl-
      - name: Scout
        if: inputs.step == 'scout'
        run: mkdir -p out && python -u tools/showcase/scout.py out 2>&1 | tee out/scout.log
      - name: Build
        if: inputs.step == 'build'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip -q install playwright==1.56.0 pillow mutagen
          python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p out
          python -u tools/showcase/build.py out > out/build.log 2>&1 &
          pid=$!
          # the log, every minute, on the showcase-progress branch (job logs can't be read from outside)
          push() { rm -rf /tmp/p && mkdir -p /tmp/p && cp out/build.log /tmp/p/ && cd /tmp/p && git init -q -b p && git -c user.name=ci -c user.email=ci@localhost commit -qam log --allow-empty 2>/dev/null; git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm log; git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" p:showcase-progress; cd - >/dev/null; }
          while kill -0 $pid 2>/dev/null; do sleep 60; push || true; done
          wait $pid; rc=$?; push || true; exit $rc
      - name: Publish
        if: always()
        run: |
          mkdir -p out && echo "${{ job.status }} ${{ inputs.step }} ${GITHUB_SHA} $(date -u +%FT%TZ)" > out/STATUS
          cd out && git init -q -b showcase-data
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "showcase ${{ inputs.step }} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" showcase-data:showcase-${{ inputs.step }}
